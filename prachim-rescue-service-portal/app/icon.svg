<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f265c" />
      <stop offset="50%" stop-color="#16377e" />
      <stop offset="100%" stop-color="#09142e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Gold Trim -->
  <circle cx="50" cy="50" r="48" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Star of Life / Emergency Emblem -->
  <!-- Vertical Beam -->
  <rect x="44" y="20" width="12" height="60" rx="3" fill="url(#redGrad)" stroke="#ffffff" stroke-width="1.5" />
  <!-- Horizontal Beam -->
  <rect x="20" y="44" width="60" height="12" rx="3" fill="url(#redGrad)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Center Golden Disc -->
  <circle cx="50" cy="50" r="16" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />
  <circle cx="50" cy="50" r="11" fill="#0f265c" />

  <!-- Center Rescue Flame / Torch Icon -->
  <path d="M50 42 C48 45, 45 47, 45 51 C45 54, 47 57, 50 57 C53 57, 55 54, 55 51 C55 48, 52 45, 50 42 Z" fill="#fbbf24" />
  <path d="M50 46 C49 48, 48 49, 48 51 C48 53, 49 54, 50 54 C51 54, 52 53, 52 51 C52 49, 51 48, 50 46 Z" fill="#ffffff" />
</svg>
